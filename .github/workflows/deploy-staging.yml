name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on:
      - self-hosted
      - staging
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate .env for Docker Compose
        run: |
          cat <<EOF > .env
          PROJECT_NAME="MiKiNO (staging)"
          ENVIRONMENT=staging
          DOMAIN=staging.mikino.nl
          STACK_NAME=mikiboxd-staging
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID=${{ secrets.TELEGRAM_USER_ID }}
          TMDB_KEY=${{ secrets.TMDB_KEY }}
          SCRAPE_MONITOR_API_KEY=${{ secrets.SCRAPE_MONITOR_API_KEY }}
          FRONTEND_HOST=https://dashboard.staging.mikino.nl
          PUBLIC_HOST=https://staging.mikino.nl
          API_HOST=https://api.staging.mikino.nl
          POSTGRES_TESTING_SERVER=db
          POSTGRES_TESTING_POST=5432
          POSTGRES_TESTING_DB=app_test
          POSTGRES_TESTING_USER=postgres
          POSTGRES_TESTINGPASSWORD=changethis
          DOCKER_IMAGE_BACKEND=backend
          DOCKER_IMAGE_FRONTEND=frontend
          BACKEND_CORS_ORIGINS="https://staging.mikino.nl,https://www.staging.mikino.nl,https://api.staging.mikino.nl,https://dashboard.staging.mikino.nl"
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_TLS=True
          SMTP_SSL=False
          SMTP_PORT=587
          # SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          GOOGLE_CLIENT_IDS=431188931459-qmiraea4nmnafn3c2akg8vhjch35virq.apps.googleusercontent.com,431188931459-nmhhqnre4ib6eul5quf421n6b6unu3f3.apps.googleusercontent.com,431188931459-bk25fu3s4ahsc0i7lkffkgn8cfebn4ru.apps.googleusercontent.com
          EOF
      - run: docker compose -f docker-compose.yml --project-name mikiboxd-staging build
      - name: Stop staging app containers before the database copy
        # User-generated tables are truncated and reloaded below; the previous
        # deploy's backend and scheduler would otherwise act on a half-synced
        # database while it happens.
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging stop backend scheduler frontend adminer
      - name: Start staging database
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging up --detach db
      - name: Wait for staging database to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mikiboxd-staging-db-1)" = "healthy" ]; then
              echo "staging db healthy"; exit 0
            fi
            echo "waiting for staging db... ($i)"; sleep 2
          done
          echo "staging db did not become healthy" >&2; exit 1
      - name: Copy user-generated data from production into staging
        # Only account/user data is synced here, not content: movie, showtime,
        # cinema, city, and everything the scraper owns (cinemaroomcapacity,
        # deletedshowtime, showtimesourcepresence, scraperun, scraperecap,
        # tmdblookupcache, letterboxdlist, letterboxdlistfilm) are left exactly as
        # staging's own scraper already has them, and the database is never
        # dropped/recreated, so that data is never cleared by a deploy.
        #
        # Each listed table is truncated in staging and reloaded from production
        # as individual INSERT statements, run without --single-transaction and
        # without ON_ERROR_STOP, so a row whose showtime_id/movie_id/cinema_id
        # doesn't exist in staging's independently-scraped content just fails
        # that one INSERT and the rest of the sync continues. pushtoken is
        # truncated only, never copied: production device tokens must never
        # reach staging.
        #
        # --column-inserts (not plain --inserts): dev migrates ahead of prod
        # by design, so a table's column order/count on staging and prod can
        # differ at deploy time. Plain --inserts writes positional VALUES
        # lists with no column names, which silently scrambles data — or
        # worse, hard-fails every row with a type mismatch — the moment the
        # two schemas diverge (this broke the `user` copy entirely once,
        # 2026-09-01). --column-inserts names each column explicitly, so a
        # copy only ever fails on genuinely incompatible columns, never on
        # column order.
        run: |
          set -o pipefail
          USER_DATA_TABLES=(
            user user_login_email userblock userreport
            friendship friendrequest
            letterboxd userletterboxdlist
            cinemaselection cinemapreset savedpreset
            notification
            watchlistselection watchedselection showtimeselection
            showtimeping showtimepinglink showtimereport
            showtimevisibilitysetting showtimevisibilityeffective
            soldoutwatch
            watchlistdigestqueueentry watchlistdigestnotifiedmovie
            analyticsevent
          )
          TABLE_ARGS=()
          QUOTED_TABLES=()
          for t in "${USER_DATA_TABLES[@]}"; do
            TABLE_ARGS+=(--table="$t")
            QUOTED_TABLES+=("\"$t\"")
          done
          QUOTED_TABLES+=("pushtoken")

          docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -c "TRUNCATE TABLE $(IFS=,; echo "${QUOTED_TABLES[*]}") CASCADE;"

          docker exec mikiboxd-db-1 pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            --no-owner --no-privileges --data-only --column-inserts \
            "${TABLE_ARGS[@]}" \
            | docker exec -i mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB"
      - run: docker compose -f docker-compose.yml --project-name mikiboxd-staging up --detach
      - name: Wait for staging backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mikiboxd-staging-backend-1)" = "healthy" ]; then
              echo "staging backend healthy"; exit 0
            fi
            echo "waiting for staging backend... ($i)"; sleep 2
          done
          echo "staging backend did not become healthy" >&2; exit 1
      - name: Make Test User friends with everyone in staging
        run: |
          docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
          INSERT INTO friendship (user_id, friend_id, shares_status)
          SELECT u.id, t.id, true FROM \"user\" u, \"user\" t
          WHERE t.email = 'test@midaskiebert.nl' AND u.id != t.id
          ON CONFLICT DO NOTHING;
          INSERT INTO friendship (user_id, friend_id, shares_status)
          SELECT t.id, u.id, true FROM \"user\" u, \"user\" t
          WHERE t.email = 'test@midaskiebert.nl' AND u.id != t.id
          ON CONFLICT DO NOTHING;
          "
      - name: Rebuild friend-status visibility cache for everyone
        run: docker exec mikiboxd-staging-backend-1 python scripts/rebuild-all-visibility.py
      - name: Dump prestart logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging logs prestart backend --no-color --tail 200
