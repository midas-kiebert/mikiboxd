name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on:
      - self-hosted
      - staging
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate .env for Docker Compose
        run: |
          cat <<EOF > .env
          PROJECT_NAME="MiKiNO (staging)"
          ENVIRONMENT=staging
          DOMAIN=staging.mikino.nl
          STACK_NAME=mikiboxd-staging
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          # Staging runs on prod's users: mail only reaches these test inboxes
          # (comma-separated, "@domain" allowed). Set in the repo's Actions
          # variables; empty means staging emails nobody but the admin inboxes.
          NON_PROD_EMAIL_ALLOWLIST=${{ vars.NON_PROD_EMAIL_ALLOWLIST }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID=${{ secrets.TELEGRAM_USER_ID }}
          TMDB_KEY=${{ secrets.TMDB_KEY }}
          SCRAPE_MONITOR_API_KEY=${{ secrets.SCRAPE_MONITOR_API_KEY }}
          FRONTEND_HOST=https://staging.mikino.nl
          PUBLIC_HOST=https://staging.mikino.nl
          API_HOST=https://api.staging.mikino.nl
          POSTGRES_TESTING_SERVER=db
          POSTGRES_TESTING_POST=5432
          POSTGRES_TESTING_DB=app_test
          POSTGRES_TESTING_USER=postgres
          POSTGRES_TESTINGPASSWORD=changethis
          DOCKER_IMAGE_BACKEND=backend
          DOCKER_IMAGE_FRONTEND=frontend
          BACKEND_CORS_ORIGINS="https://staging.mikino.nl,https://www.staging.mikino.nl,https://api.staging.mikino.nl,https://dashboard.staging.mikino.nl"
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_TLS=True
          SMTP_SSL=False
          SMTP_PORT=587
          # SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          GOOGLE_CLIENT_IDS=431188931459-qmiraea4nmnafn3c2akg8vhjch35virq.apps.googleusercontent.com,431188931459-nmhhqnre4ib6eul5quf421n6b6unu3f3.apps.googleusercontent.com,431188931459-bk25fu3s4ahsc0i7lkffkgn8cfebn4ru.apps.googleusercontent.com
          VITE_GOOGLE_CLIENT_ID=431188931459-qmiraea4nmnafn3c2akg8vhjch35virq.apps.googleusercontent.com
          APPLE_WEB_CLIENT_ID=com.midaskiebert.mikino.web
          APPLE_WEB_REDIRECT_URI=https://staging.mikino.nl/login
          EOF
      - run: docker compose -f docker-compose.yml --project-name mikiboxd-staging build
      - name: Stop staging app containers before the database copy
        # The database is dropped and replaced with prod's below; the previous
        # deploy's backend and scheduler would otherwise act on a half-restored
        # database while it happens.
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging stop backend scheduler frontend adminer
      - name: Start staging database
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging up --detach db
      - name: Wait for staging database to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mikiboxd-staging-db-1)" = "healthy" ]; then
              echo "staging db healthy"; exit 0
            fi
            echo "waiting for staging db... ($i)"; sleep 2
          done
          echo "staging db did not become healthy" >&2; exit 1
      - name: Mirror the production database into staging
        # Staging becomes an exact copy of prod at deploy time — users,
        # statuses, notifications *and* content — and dev's migrations then
        # run on top in prestart (prod's head is always an ancestor of dev's:
        # see the alembic merge-point rule). Copying only the user tables over
        # staging's own scraped screenings, as this used to, left statuses and
        # notifications pointing at whatever screening had the same id here
        # (22 of 57 distinct statuses were on the wrong screening, 2026-09-24).
        #
        # A fresh database, not a restore over the old one: restoring over an
        # existing schema silently skipped tables and dropped FKs (2026-07-25).
        # pushtoken keeps its schema but no rows — prod's device tokens must
        # never reach staging; phones re-register when the staging app opens.
        # Email to prod's users is stopped in the app by
        # NON_PROD_EMAIL_ALLOWLIST, not here.
        run: |
          set -euo pipefail
          DUMP=/tmp/prod-mirror.dump
          docker exec mikiboxd-db-1 pg_dump -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -Fc --no-owner --no-acl --exclude-table-data=pushtoken > "$DUMP"
          docker cp "$DUMP" mikiboxd-staging-db-1:$DUMP
          rm -f "$DUMP"

          docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS \"$POSTGRES_DB\" WITH (FORCE);" \
            -c "CREATE DATABASE \"$POSTGRES_DB\";"
          docker exec mikiboxd-staging-db-1 pg_restore -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            --no-owner --no-acl --single-transaction --exit-on-error $DUMP
          docker exec mikiboxd-staging-db-1 rm -f $DUMP

          # Belt and braces on --exclude-table-data.
          tokens=$(docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA \
            -c "SELECT count(*) FROM pushtoken;")
          if [ "$tokens" != "0" ]; then
            docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
              -c "TRUNCATE pushtoken;"
          fi
          echo "staging now mirrors prod at $(docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c 'SELECT version_num FROM alembic_version;')"
      - name: Restart the staging app
        # Runs even if the data copy above failed partway: that step's job is
        # to sync data into an already-stopped app, not to gate whether the
        # app comes back — a bug in it must never leave staging down the way
        # a bad `pg_get_serial_sequence` call did on 2026-09-01 (the copy
        # step errored, `set -e` stopped the job right there, and because
        # this restart was the *next* step it silently never ran).
        if: always()
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging up --detach
      - name: Wait for staging backend to be healthy
        if: always()
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mikiboxd-staging-backend-1)" = "healthy" ]; then
              echo "staging backend healthy"; exit 0
            fi
            echo "waiting for staging backend... ($i)"; sleep 2
          done
          echo "staging backend did not become healthy" >&2; exit 1
      - name: Make Test User friends with everyone in staging
        run: |
          docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
          INSERT INTO friendship (user_id, friend_id, shares_status)
          SELECT u.id, t.id, true FROM \"user\" u, \"user\" t
          WHERE t.email = 'test@midaskiebert.nl' AND u.id != t.id
          ON CONFLICT DO NOTHING;
          INSERT INTO friendship (user_id, friend_id, shares_status)
          SELECT t.id, u.id, true FROM \"user\" u, \"user\" t
          WHERE t.email = 'test@midaskiebert.nl' AND u.id != t.id
          ON CONFLICT DO NOTHING;
          "
      - name: Rebuild friend-status visibility cache for everyone
        run: docker exec mikiboxd-staging-backend-1 python scripts/rebuild-all-visibility.py
      - name: Dump prestart logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging logs prestart backend --no-color --tail 200
