appId: com.midaskiebert.mikino
---
# Reusable sub-flow: log in with the staging screenshot account and land on
# the Showtimes tab. MAESTRO_TEST_EMAIL / MAESTRO_TEST_PASSWORD are supplied
# via `maestro test --env` (see .github/workflows/ios-screenshots.yml) and
# must never be hardcoded here.
- launchApp:
    clearState: true
# First launch after a fresh install pulls a full cold compile of this app's
# JS bundle (1500+ modules), which has taken several minutes in practice —
# far past Maestro's default 17s action timeout, hence the 5-minute wait.
- extendedWaitUntil:
    visible: "you@example.com or username|Dismiss"
    timeout: 300000
# A completely fresh device/first-ever launch can hit Expo Router's known
# "navigate before mounting Root Layout" dev-only redbox (an auth-guard
# redirect firing before the router is ready). It shows up as either a
# native "could not connect" dialog (Dismiss/Reload/Copy/Extra Info) or an
# in-JS LogBox render-error overlay (Dismiss/Minimize only, and it can queue
# more than one — "Log 2 of 3" etc). Interacting with either overlay's own
# buttons (tried both) left the router in a broken state that never
# recovered for the rest of the flow. A full stop+relaunch avoids the race
# entirely, since it's specific to the very first cold JS execution.
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - stopApp
      - launchApp
- extendedWaitUntil:
    visible: "you@example.com or username"
    timeout: 300000
- tapOn: "you@example.com or username"
- inputText: "${MAESTRO_TEST_EMAIL}"
- tapOn: "Your password"
- inputText: "${MAESTRO_TEST_PASSWORD}"
# hideKeyboard isn't supported on this keyboard config ("Couldn't hide the
# keyboard... doesn't expose a standard dismiss action") — tapping a static
# label dismisses it instead.
- tapOn: "Welcome back"
- tapOn: "Log In"
# Two dialogs can cover the tab bar after a successful login: iOS's own
# "Save Password?" prompt, and the app's in-app "Notifications are on"
# confirmation. Neither appears every time, so both are optional.
- extendedWaitUntil:
    visible: "Showtimes|Not Now|Done"
    timeout: 30000
- runFlow:
    when:
      visible: "Not Now"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
# Not "Showtimes" (the tab bar label): dev-only LogBox warning toasts at the
# bottom of the screen can cover the tab bar without blocking anything else.
# "MiKiNO" (header title) confirms the same thing — successfully landed on
# the signed-in home screen — without depending on what those toasts hide.
- assertVisible: "MiKiNO"
