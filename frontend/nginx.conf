# Link-preview crawlers (WhatsApp, iMessage, Slack, ...) get a backend-rendered
# HTML page with per-showtime/per-movie OpenGraph tags instead of the SPA's
# static index.html, which is the same for every route and can't vary per page.
map $http_user_agent $is_link_preview_bot {
  default 0;
  "~*WhatsApp|facebookexternalhit|Facebot|Twitterbot|TelegramBot|Slackbot|Slack-ImgProxy|LinkedInBot|Discordbot|redditbot|SkypeUriPreview|Pinterest|vkShare|Applebot|iMessage" 1;
}

server {
  listen 80;

  location = /apple-app-site-association {
    root /usr/share/nginx/html;
    default_type application/json;
    try_files $uri =404;
  }

  location ^~ /.well-known/ {
    root /usr/share/nginx/html;
    default_type application/json;
    try_files $uri =404;
  }

  location ~ ^/ping/(?<showtime_id>[^/]+)/(?<sender>[^/]+)$ {
    if ($is_link_preview_bot = 1) {
      proxy_pass http://backend:8000/api/v1/showtimes/$showtime_id/share-preview/$sender;
    }
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files /index.html =404;
  }

  location ~ ^/movie/(?<movie_id>[^/]+)$ {
    if ($is_link_preview_bot = 1) {
      proxy_pass http://backend:8000/api/v1/movies/$movie_id/share-preview;
    }
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files /index.html =404;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html index.htm;
    try_files $uri /index.html =404;
  }

  include /etc/nginx/extra-conf.d/*.conf;
}
