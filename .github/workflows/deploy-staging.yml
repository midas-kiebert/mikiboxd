name: Deploy to Staging

on:
  workflow_dispatch:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on:
      - self-hosted
      - staging
    env:
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Generate .env for Docker Compose
        run: |
          cat <<EOF > .env
          PROJECT_NAME="MiKiNO (staging)"
          ENVIRONMENT=staging
          DOMAIN=staging.mikino.nl
          STACK_NAME=mikiboxd-staging
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER=admin@example.com
          FIRST_SUPERUSER_PASSWORD=${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          EMAILS_FROM_EMAIL=${{ secrets.EMAILS_FROM_EMAIL }}
          POSTGRES_USER=${{ secrets.POSTGRES_USER }}
          POSTGRES_DB=${{ secrets.POSTGRES_DB }}
          POSTGRES_SERVER=db
          POSTGRES_PORT=5432
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_USER_ID=${{ secrets.TELEGRAM_USER_ID }}
          TMDB_KEY=${{ secrets.TMDB_KEY }}
          SCRAPE_MONITOR_API_KEY=${{ secrets.SCRAPE_MONITOR_API_KEY }}
          FRONTEND_HOST=https://dashboard.staging.mikino.nl
          PUBLIC_HOST=https://staging.mikino.nl
          API_HOST=https://api.staging.mikino.nl
          POSTGRES_TESTING_SERVER=db
          POSTGRES_TESTING_POST=5432
          POSTGRES_TESTING_DB=app_test
          POSTGRES_TESTING_USER=postgres
          POSTGRES_TESTINGPASSWORD=changethis
          DOCKER_IMAGE_BACKEND=backend
          DOCKER_IMAGE_FRONTEND=frontend
          BACKEND_CORS_ORIGINS="https://staging.mikino.nl,https://www.staging.mikino.nl,https://api.staging.mikino.nl,https://dashboard.staging.mikino.nl"
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
          SMTP_TLS=True
          SMTP_SSL=False
          SMTP_PORT=587
          # SENTRY_DSN=${{ secrets.SENTRY_DSN }}
          GOOGLE_CLIENT_IDS=431188931459-qmiraea4nmnafn3c2akg8vhjch35virq.apps.googleusercontent.com,431188931459-nmhhqnre4ib6eul5quf421n6b6unu3f3.apps.googleusercontent.com,431188931459-bk25fu3s4ahsc0i7lkffkgn8cfebn4ru.apps.googleusercontent.com
          EOF
      - run: docker compose -f docker-compose.yml --project-name mikiboxd-staging build
      - name: Stop staging app containers before the database copy
        # User-generated tables are truncated and reloaded below; the previous
        # deploy's backend and scheduler would otherwise act on a half-synced
        # database while it happens.
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging stop backend scheduler frontend adminer
      - name: Start staging database
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging up --detach db
      - name: Wait for staging database to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mikiboxd-staging-db-1)" = "healthy" ]; then
              echo "staging db healthy"; exit 0
            fi
            echo "waiting for staging db... ($i)"; sleep 2
          done
          echo "staging db did not become healthy" >&2; exit 1
      - name: Copy user-generated data from production into staging
        # Only account/user data is synced here, not content: movie, showtime,
        # cinema, city, and everything the scraper owns (cinemaroomcapacity,
        # deletedshowtime, showtimesourcepresence, scraperun, scraperecap,
        # tmdblookupcache, letterboxdlist, letterboxdlistfilm) are left exactly as
        # staging's own scraper already has them, and the database is never
        # dropped/recreated, so that data is never cleared by a deploy.
        #
        # Each listed table is truncated in staging and reloaded from
        # production one row at a time, inside a per-row exception handler —
        # see `copy_table_common_columns` below — so a row whose
        # showtime_id/movie_id/cinema_id doesn't exist in staging's
        # independently-scraped content just fails that one row and the rest
        # of the table's sync continues. pushtoken is truncated only, never
        # copied: production device tokens must never reach staging.
        #
        # Not a plain pg_dump: dev migrates ahead of prod by design, so a
        # table's columns can differ between the two databases at deploy
        # time — prod may be missing a column staging has just added, or
        # still have one staging just dropped. pg_dump has no way to copy
        # only the columns two databases actually have in common (even
        # --column-inserts still names every column of the *source* table,
        # so a column dropped on staging still crashes the whole copy — this
        # took down the entire `user` table, and everything that referenced
        # it, on 2026-09-01). `copy_table_common_columns` computes the
        # column intersection per table and copies only those, so a
        # migration adding or dropping a column here never breaks a deploy —
        # the new/dropped column is just absent from this sync until prod
        # catches up (a merge to master), same as it always implicitly was
        # for columns pg_dump could still handle.
        run: |
          set -euo pipefail
          # Order matters now that each table is copied (and FK-checked) on
          # its own: `letterboxd` must land before `user` (notify_watchlist_
          # digest_list_id/letterboxd_username reference it) and before
          # `watchlistselection`/`watchedselection`, or every row with a
          # foreign key into it fails as "skipped" even though the
          # referenced row exists on both sides — it just hadn't been
          # copied yet. Every other listed table depends on `user`, so
          # anything is fine after that.
          USER_DATA_TABLES=(
            letterboxd
            user user_login_email userblock userreport
            friendship friendrequest
            userletterboxdlist
            cinemaselection cinemapreset savedpreset
            notification
            watchlistselection watchedselection showtimeselection
            showtimeping showtimepinglink showtimereport
            showtimevisibilitysetting showtimevisibilityeffective
            soldoutwatch
            watchlistdigestqueueentry watchlistdigestnotifiedmovie
            analyticsevent
          )
          QUOTED_TABLES=()
          for t in "${USER_DATA_TABLES[@]}"; do
            QUOTED_TABLES+=("\"$t\"")
          done
          QUOTED_TABLES+=("pushtoken")

          docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
            -v ON_ERROR_STOP=1 \
            -c "TRUNCATE TABLE $(IFS=,; echo "${QUOTED_TABLES[*]}") CASCADE;"

          copy_table_common_columns() {
            local table="$1"
            local cols
            cols=$(comm -12 \
              <(docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c \
                  "SELECT column_name FROM information_schema.columns WHERE table_name='$table' ORDER BY column_name;" | sort) \
              <(docker exec mikiboxd-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA -c \
                  "SELECT column_name FROM information_schema.columns WHERE table_name='$table' ORDER BY column_name;" | sort) \
              | paste -sd, -)

            if [ -z "$cols" ]; then
              echo "::warning::$table has no columns in common between production and staging; skipping"
              return
            fi

            local tsv="/tmp/reseed_${table}.tsv"
            docker exec mikiboxd-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -c "\\copy (SELECT $cols FROM \"$table\") TO STDOUT" > "$tsv"
            docker cp "$tsv" "mikiboxd-staging-db-1:$tsv"
            rm -f "$tsv"

            # A plain \copy into the real table is all-or-nothing per call —
            # one bad row would lose the whole table — so the data lands in
            # an unconstrained scratch table first, and only the row-by-row
            # loop below (inside its own BEGIN/EXCEPTION block) touches the
            # real table. `r` must be typed `tmp_copy%ROWTYPE`, not the
            # generic `RECORD`: PL/pgSQL can't dereference a bare RECORD's
            # fields, since temp tables (and their row types) are created and
            # torn down within this one session. Chained -c flags (not a
            # heredoc) so every statement — including the temp table and the
            # DO block — runs in that one session/connection: a heredoc's
            # closing marker can't be indented to match this YAML block
            # without breaking either the heredoc or the block scalar.
            docker exec -i mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
              -c "CREATE TEMP TABLE tmp_copy AS SELECT $cols FROM \"$table\" WITH NO DATA;" \
              -c "\\copy tmp_copy FROM '$tsv'" \
              -c "DO \$do\$ DECLARE r tmp_copy%ROWTYPE; copied int := 0; skipped int := 0; BEGIN FOR r IN SELECT * FROM tmp_copy LOOP BEGIN INSERT INTO \"$table\" ($cols) SELECT (r).*; copied := copied + 1; EXCEPTION WHEN OTHERS THEN skipped := skipped + 1; END; END LOOP; RAISE NOTICE '$table: copied %, skipped %', copied, skipped; END \$do\$;" \
              -c "DROP TABLE tmp_copy;"

            docker exec mikiboxd-staging-db-1 rm -f "$tsv"
          }

          for t in "${USER_DATA_TABLES[@]}"; do
            # A failure copying one table (docker hiccup, a table that
            # genuinely doesn't exist on one side) must not stop every table
            # after it from being attempted too.
            copy_table_common_columns "$t" || echo "::warning::Failed to copy $t from production, continuing"
          done
      - run: docker compose -f docker-compose.yml --project-name mikiboxd-staging up --detach
      - name: Wait for staging backend to be healthy
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' mikiboxd-staging-backend-1)" = "healthy" ]; then
              echo "staging backend healthy"; exit 0
            fi
            echo "waiting for staging backend... ($i)"; sleep 2
          done
          echo "staging backend did not become healthy" >&2; exit 1
      - name: Make Test User friends with everyone in staging
        run: |
          docker exec mikiboxd-staging-db-1 psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "
          INSERT INTO friendship (user_id, friend_id, shares_status)
          SELECT u.id, t.id, true FROM \"user\" u, \"user\" t
          WHERE t.email = 'test@midaskiebert.nl' AND u.id != t.id
          ON CONFLICT DO NOTHING;
          INSERT INTO friendship (user_id, friend_id, shares_status)
          SELECT t.id, u.id, true FROM \"user\" u, \"user\" t
          WHERE t.email = 'test@midaskiebert.nl' AND u.id != t.id
          ON CONFLICT DO NOTHING;
          "
      - name: Rebuild friend-status visibility cache for everyone
        run: docker exec mikiboxd-staging-backend-1 python scripts/rebuild-all-visibility.py
      - name: Dump prestart logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml --project-name mikiboxd-staging logs prestart backend --no-color --tail 200
