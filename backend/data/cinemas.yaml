# `key` is the cinema's identity: it is what the seeder upserts on and what
# scrapers look themselves up by, so it must never change once a cinema is live.
# Nothing outside the backend ever sees it.
#
# `name` is the display name, and is the only name clients are shown. It is free
# to change at any time — editing it here renames the cinema in place on the next
# deploy, keeping its id and all of its showtimes.
#
# `aliases` are the other names this cinema is known by: names Cineville uses for
# the venue, and former display names. They are matched when ingesting Cineville
# showtimes and when a user searches by cinema, so a rename can neither break
# ingestion nor make the cinema unsearchable under its old name.
#
# Optional `seating` presets per cinema (defined in app/validators/cinema_seating.py):
# - unknown (default if omitted) — row and seat accept a letter or 1-2 digits
# - free                        — no assigned seating, no seat input allowed
# - number-number               — row: 1-2 digits, seat: 1-2 digits
# - letter-number               — row: single letter, seat: 1-2 digits
# - number-letter               — row: 1-2 digits, seat: single letter
# - letter-letter               — row: single letter, seat: single letter

